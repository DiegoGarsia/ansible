---
gitlab_external_url: "http://gitlab.diego.home"
gitlab_registry_external_url: "http://gitlab.diego.home:5050"
gitlab_runner_name: "gitlab-diego-home-docker"
gitlab_runner_tags: "docker,linux"
# Токен Runner. При первом запуске оставьте пустым.
# После создания Runner в GitLab получите токен (glrt-...) и сохраните в vault.yml.
gitlab_runner_token: "{{ vault_gitlab_runner_token | default('') }}"

# Заполните после создания проекта. ID можно взять в Settings -> General.
# gitlab_project_id: "123"
# gitlab_api_token: "{{ vault_gitlab_api_token }}"
# gitlab_cicd_variables:
#   - key: APP_SECRET
#     value: "{{ vault_application_secret }}"
#     masked: true
#     protected: true
