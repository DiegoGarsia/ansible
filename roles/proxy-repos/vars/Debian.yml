---
# =============================================================================
# proxy-repos — переменные для Debian
# =============================================================================
# Файлы источников APT, в которых выполняется замена URL на зеркало.
# Debian по умолчанию использует классический /etc/apt/sources.list.
# =============================================================================
proxy_repos_apt_mirror_files:
  - path: "/etc/apt/sources.list"
    backup: true
