---
# =============================================================================
# proxy-repos — переменные по умолчанию
# =============================================================================
# Этот файл содержит значения по умолчанию для всех переменных роли.
# Их можно переопределить в playbook, group_vars, host_vars или через
# --extra-vars. Приоритет: host_vars > group_vars > playbook > defaults.
#
# Роль выполняет ТОЛЬКО безопасную точечную замену URL репозитория на зеркало.
# Она не удаляет файлы, не перезаписывает конфигурации целиком и не
# отключает репозитории.
# =============================================================================

# ---------------------------------------------------------------------------
# APT (Debian / Ubuntu) — замена зеркала
# ---------------------------------------------------------------------------

# Официальный URL репозитория, который будет заменён (значение "откуда").
proxy_repos_apt_mirror_from: "http://archive.ubuntu.com/ubuntu"

# URL зеркала, на которое будет заменён официальный репозиторий (значение "куда").
# Эту переменную достаточно изменить при запуске роли.
proxy_repos_apt_mirror_to: "https://mirror.yandex.ru/ubuntu/"

# Создавать ли резервную копию файла перед изменением.
proxy_repos_apt_mirror_backup: true

# Список файлов для обработки (APT).
# Автоопределяется по ОС в vars/, но может быть переопределён.
# Каждый элемент — словарь: { path: <файл>, backup: <bool> }
proxy_repos_apt_mirror_files: []

# ---------------------------------------------------------------------------
# YUM / DNF (RedHat / CentOS / Rocky / AlmaLinux) — замена зеркала
# ---------------------------------------------------------------------------

# Официальный URL репозитория, который будет заменён (значение "откуда").
proxy_repos_yum_mirror_from: "http://mirror.centos.org/centos"

# URL зеркала, на которое будет заменён официальный репозиторий (значение "куда").
# Эту переменную достаточно изменить при запуске роли.
proxy_repos_yum_mirror_to: "http://mirror.yandex.ru/centos/"

# Создавать ли резервную копию файла перед изменением.
proxy_repos_yum_mirror_backup: true

# Список файлов для обработки (YUM/DNF).
# Автоопределяется по ОС в vars/, но может быть переопределён.
# Каждый элемент — словарь: { path: <файл>, backup: <bool> }
proxy_repos_yum_mirror_files: []

# ---------------------------------------------------------------------------
# Глобальные настройки
# ---------------------------------------------------------------------------

# Запускать apt-get update / yum makecache после изменения конфигурации.
# Обновляет только индексы пакетов, не устанавливая и не обновляя пакеты.
proxy_repos_update_cache: true
