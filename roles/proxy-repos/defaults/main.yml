---
# =============================================================================
# proxy-repos — default variables
# =============================================================================
# All variables can be overridden in playbook, group_vars, host_vars, etc.
# =============================================================================

# ---------------------------------------------------------------------------
# APT (Debian / Ubuntu) proxy repository settings
# ---------------------------------------------------------------------------

# Base URL of the MTS proxy APT repository.
# Replace with the actual URL from your infrastructure.
proxy_repos_apt_base_url: >-
  http://mts-apt-proxy.example.com/{{ ansible_distribution | lower }}

# Distribution codename (e.g., focal, jammy, bullseye, bookworm).
# Auto-detected from Ansible facts, override if needed.
proxy_repos_apt_distribution: "{{ ansible_distribution_release }}"

# APT suites to configure (one deb/deb-src line per suite).
# Default is just the base codename. Add "-updates", "-security",
# "-backports" suites here if the proxy repo mirrors them, e.g.:
#   proxy_repos_apt_suites:
#     - "{{ ansible_distribution_release }}"
#     - "{{ ansible_distribution_release }}-updates"
#     - "{{ ansible_distribution_release }}-security"
proxy_repos_apt_suites:
  - "{{ proxy_repos_apt_distribution }}"

# Repository components (space-separated).
proxy_repos_apt_components: "main restricted universe multiverse"

# Architectures to include in the sources.list line.
proxy_repos_apt_architectures: "amd64"

# Whether to include deb-src lines.
proxy_repos_apt_include_src: true

# If true, remove all existing files in /etc/apt/sources.list.d/
# before deploying the new configuration.
# WARNING: This will delete ANY file in that directory, including
# files created by other roles or manually. Set to true only if
# you are certain the proxy repo is the sole apt source.
proxy_repos_apt_clean_sources_list_d: false

# Path to the main APT sources.list file.
proxy_repos_apt_sources_list_path: "/etc/apt/sources.list"

# ---------------------------------------------------------------------------
# YUM / DNF (RedHat / CentOS / Rocky / AlmaLinux) proxy repository settings
# ---------------------------------------------------------------------------

# Base URL of the MTS proxy YUM repository.
# Replace with the actual URL from your infrastructure.
# Use a single-line string — YAML folding (>-) would introduce a space.
proxy_repos_yum_base_url: "http://mts-yum-proxy.example.com/{{ ansible_distribution | lower }}/$releasever/$basearch/"

# Whether to enable GPG signature checking.
proxy_repos_yum_gpgcheck: false

# GPG key URL (optional — only used when gpgcheck is true).
proxy_repos_yum_gpgkey: ""

# Whether the repository should be enabled by default.
proxy_repos_yum_enabled: true

# Human-readable repository name (used in .repo file).
proxy_repos_yum_name: "MTS Proxy Repository"

# Repository ID (used in .repo file section header).
proxy_repos_yum_repo_id: "mts-proxy"

# If true, remove default distribution repositories (baseos, appstream, etc.)
# from /etc/yum.repos.d/ when deploying the proxy repo.
# WARNING: This deletes repositories by name and may not cover all
# distribution-specific defaults. Set to true only if the proxy repo
# replaces all standard repositories.
proxy_repos_yum_disable_default_repos: false

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------

# Run apt-get update / yum makecache after changing repository configuration.
proxy_repos_update_cache: true
