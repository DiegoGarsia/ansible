---
# =============================================================================
# proxy-repos — обработчики
# =============================================================================
# Оба обработчика слушают одно и то же событие "update package cache",
# но каждый ограничен условием по семейству ОС, чтобы на целевом хосте
# обновлялся кэш только соответствующего менеджера пакетов.
# =============================================================================

# Обновление кэша APT (Debian / Ubuntu).
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  listen: "update package cache"
  when:
    - proxy_repos_update_cache
    - ansible_facts.os_family == "Debian"

# Обновление кэша YUM/DNF (семейство RedHat).
- name: Update YUM/DNF cache
  ansible.builtin.yum:
    update_cache: true
  listen: "update package cache"
  when:
    - proxy_repos_update_cache
    - ansible_facts.os_family == "RedHat"
