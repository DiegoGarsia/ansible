---
# =============================================================================
# proxy-repos — задачи
# =============================================================================
# Безопасная замена зеркала: роль заменяет настроенный URL "откуда" на URL
# "куда" внутри существующих файлов источников. Она не удаляет файлы, не
# перезаписывает конфигурации целиком и не отключает репозитории.
# Всё остальное содержимое файлов сохраняется.
# =============================================================================

# Сбор фактов об ОС (семейство, дистрибутив, версия).
- name: Gather OS facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "distribution"
      - "os_family"
  when: ansible_facts is not defined or not ansible_facts.get('os_family')

# Подключение OS-специфичных переменных (списки файлов для обработки).
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"

# ---------------------------------------------------------------------------
# Debian / Ubuntu — замена URL APT-репозитория
# ---------------------------------------------------------------------------
- name: Replace APT repository URL (Debian / Ubuntu)
  when: ansible_os_family == "Debian"
  block:
    # Проверка, какие файлы источников APT существуют.
    - name: Check which APT source files exist
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ proxy_repos_apt_mirror_files }}"
      register: _apt_mirror_files_stat

    # Точечная замена официального URL на зеркало.
    - name: Replace official repository URL with mirror
      ansible.builtin.replace:
        path: "{{ item.item.path }}"
        regexp: "{{ proxy_repos_apt_mirror_from | regex_escape }}"
        replace: "{{ proxy_repos_apt_mirror_to }}"
        backup: "{{ item.item.backup | default(proxy_repos_apt_mirror_backup) }}"
      loop: "{{ _apt_mirror_files_stat.results }}"
      when: item.stat.exists
      notify: update package cache

# ---------------------------------------------------------------------------
# RedHat / CentOS / Rocky / AlmaLinux — замена URL YUM/DNF-репозитория
# ---------------------------------------------------------------------------
- name: Replace YUM/DNF repository URL (RedHat family)
  when: ansible_os_family == "RedHat"
  block:
    # Проверка, какие файлы репозиториев YUM/DNF существуют.
    - name: Check which YUM/DNF repo files exist
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ proxy_repos_yum_mirror_files }}"
      register: _yum_mirror_files_stat

    # Точечная замена официального URL на зеркало.
    - name: Replace official repository URL with mirror
      ansible.builtin.replace:
        path: "{{ item.item.path }}"
        regexp: "{{ proxy_repos_yum_mirror_from | regex_escape }}"
        replace: "{{ proxy_repos_yum_mirror_to }}"
        backup: "{{ item.item.backup | default(proxy_repos_yum_mirror_backup) }}"
      loop: "{{ _yum_mirror_files_stat.results }}"
      when: item.stat.exists
      notify: update package cache
