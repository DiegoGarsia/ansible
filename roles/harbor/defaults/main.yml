---
harbor_version: "2.14.0"

harbor_dir: /opt/harbor

harbor_hostname: "192.168.0.102"
harbor_port: 8081

harbor_username: admin
# Пароль администратора Harbor. Храните в Ansible Vault.
harbor_admin_password: "{{ vault_harbor_admin_password }}"

# DockerHub image
source_image: nginx:latest


# Harbor project
harbor_project: library

# куда пушим
harbor_image_name: nginx


# сколько символов брать из digest
digest_length: 8
