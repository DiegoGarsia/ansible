---
# tasks/prerequisites.yml — OS validation, common packages, UFW firewall

- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_major_version == '24'
    fail_msg: >
      This role supports Ubuntu 24.04 LTS only.
      Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}

- name: Install common prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Install and configure UFW
  when: gitlab_clarity_manage_ufw | bool
  block:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow SSH from jumphost
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: 192.168.0.100/32
        comment: SSH from jumphost

    - name: Allow HTTP (GitLab Web UI / API)
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp
        from_ip: 192.168.0.0/24
        comment: GitLab HTTP

    - name: Allow HTTPS (GitLab Web UI / API)
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp
        from_ip: 192.168.0.0/24
        comment: GitLab HTTPS

    - name: Allow Container Registry port
      community.general.ufw:
        rule: allow
        port: "5050"
        proto: tcp
        from_ip: 192.168.0.0/24
        comment: GitLab Container Registry

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
