# test.yml
# WARNING: This playbook prints vault passwords to output.
# Use only for debugging. Remove or protect before production.
---
- name: Test vault passwords
  hosts: postgres
  gather_facts: false

  tasks:
    - name: Debug vault_postgres_superuser_password
      ansible.builtin.debug:
        var: vault_postgres_superuser_password
      no_log: true

    - name: Debug postgres_superuser_password
      ansible.builtin.debug:
        var: postgres_superuser_password
      no_log: true
